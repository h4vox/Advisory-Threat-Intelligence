# Local PostgreSQL for AIE: two databases, aie_intel (shared intelligence) and aie_app (this
# instance: accounts, settings, AI sessions). See docs/db-migration.md.
#
#   POSTGRES_PASSWORD=<superuser password> docker compose -f docker-compose.db.yml up -d
#
# By default PostgreSQL listens on 127.0.0.1 only. To reach it from other machines, follow
# "Exposing the database" in docs/db-migration.md (TLS, firewall allow-list, strong passwords)
# before changing AIE_PG_BIND.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (the superuser password) before starting}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
      - -c
      - log_connections=on
    ports:
      - "${AIE_PG_BIND:-127.0.0.1}:${AIE_PG_PORT:-5432}:5432"
    volumes:
      - aie-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional, temporary: a local MongoDB the current app can use unchanged (MONGODB_URI) while the
  # app is moved to PostgreSQL. Start it with --profile interim-mongo and load the Atlas backup
  # with `npm run db:migration -- restore-mongo` (see docs/db-migration.md).
  mongo:
    image: mongo:7
    container_name: aie-mongo-local
    profiles: ["interim-mongo"]
    restart: unless-stopped
    command: ["--bind_ip_all", "--auth", "--wiredTigerCacheSizeGB", "0.3"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: aie
      MONGO_INITDB_ROOT_PASSWORD: ${AIE_MONGO_PASSWORD:?Set AIE_MONGO_PASSWORD before starting the interim MongoDB}
    ports:
      - "127.0.0.1:${AIE_MONGO_PORT:-27017}:27017"
    volumes:
      - aie-mongo-data:/data/db

volumes:
  aie-postgres-data:
  aie-mongo-data:
