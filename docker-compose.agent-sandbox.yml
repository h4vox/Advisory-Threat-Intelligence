# Isolated sandbox for the agent CLI (agy).
# - Runs as an unprivileged user with every Linux capability dropped.
# - Root filesystem is read-only; /tmp and /workspace are tmpfs scratch space.
# - The agent's home is the dedicated `aie-agent-home` volume, so the CLI's sign-in (it signs in
#   through AIE's Marketplace) and its settings survive restarts. No host directories are mounted.
# - The image installs the Antigravity CLI from Google's official installer at build time
#   (docker/agent-sandbox/Dockerfile); AIE rebuilds it when it finds only the fallback shim.
# - Network access is intentionally kept: the agent must reach the model API.
#   It is not otherwise restricted, so the agent runs print-only with tools
#   disabled (no --dangerously-skip-permissions) from the application side.
# Older versions mounted only `aie-agent-vault` at ~/.gemini; it is no longer used and can be
# removed with `docker volume rm aie-agent-vault`.
services:
  aie-agent-sandbox:
    container_name: aie-agent-sandbox
    build:
      context: ./docker/agent-sandbox
      dockerfile: Dockerfile
    image: aie-agent-sandbox:latest
    restart: unless-stopped
    init: true
    stdin_open: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /workspace:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001
    volumes:
      - aie-agent-home:/home/agent
    environment:
      - AGENT_ENV=isolated_sandbox
      - PATH=/home/agent/.local/bin:/usr/local/bin:/usr/bin:/bin
      - HOME=/home/agent
    network_mode: bridge

volumes:
  aie-agent-home:
    name: aie-agent-home
