services:
  aie-agent-sandbox:
    container_name: aie-agent-sandbox
    build:
      context: ./docker/agent-sandbox
      dockerfile: Dockerfile
    image: aie-agent-sandbox:latest
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - aie-agent-vault:/root/.gemini
    environment:
      - AGENT_ENV=isolated_sandbox
      - PATH=/root/.local/bin:/usr/local/bin:/usr/bin:/bin
      - HOME=/root
    network_mode: bridge

volumes:
  aie-agent-vault:
    name: aie-agent-vault
